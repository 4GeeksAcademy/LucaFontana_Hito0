services:
  backend:
    build:
      context: .
      dockerfile: services/Dockerfile
      target: unified
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      INCIDENTS_DB_PATH: /data/incidents/incidents.json
      SUPPLIERS_DB_PATH: /data/suppliers/suppliers.json
    ports:
      - "8000:8000"
    volumes:
      - auth-data:/app/services/JWTauth_api/data
      - incidents-data:/data/incidents
      - suppliers-data:/data/suppliers

  website:
    build:
      context: .
      dockerfile: uis/Dockerfile
      target: website
    restart: unless-stopped
    ports:
      - "3000:3000"

  backoffice:
    build:
      context: .
      dockerfile: uis/Dockerfile
      target: portal
      args:
        NEXT_PUBLIC_TALENT_API_URL: ${NEXT_PUBLIC_TALENT_API_URL:?Set NEXT_PUBLIC_TALENT_API_URL in .env.production}
        NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL:?Set NEXT_PUBLIC_AUTH_API_URL in .env.production}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL in .env.production}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      AUTH_API_BASE_URL: http://backend:8000
      INVENTORY_API_BASE_URL: http://backend:8000
      SUPPLIERS_API_BASE_URL: http://backend:8000
      INCIDENTS_API_BASE_URL: http://backend:8000
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  auth-data:
  incidents-data:
  suppliers-data:
